# CloudTech PostgreSQL 生产环境 · 2026-09-25 R288
# 用法:
#   docker compose up -d
#   python pg_migrate.py  (一次性从 SQLite 迁移)
#
# 注意:
# - SQLite 仍是 dev 默认 (auto-fallback),生产请用 Postgres
# - postgres 数据持久化到 ./postgres_data/ (本地 volume)
# - pgAdmin 在 :5050 便于可视化
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudtech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudtech
      POSTGRES_PASSWORD: ${PG_PASSWORD:-cloudtech_dev_pwd}
      POSTGRES_DB: cloudtech
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./pg_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudtech"]
      interval: 10s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cloudtech_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cloudtech.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
