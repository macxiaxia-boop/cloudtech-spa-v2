# CloudTech 全栈生产环境 · 2026-09-29 R293 + release-v2.0.0
# 用法:
#   docker compose --profile production up -d
#   docker compose --profile postgres up -d postgres pgadmin  (单独启数据库)
#
# 完整链路:
#   postgres (5432) ← backend gateway (5099) ← nginx (80/443) ← frontend SPA (5173)
#   pgAdmin (5050) 可视化管理
#
# 注意:
# - SQLite 仍是 dev 默认 (auto-fallback),生产请用 Postgres
# - postgres 数据持久化到 ./postgres_data/
# - frontend SPA 构建后由 nginx 静态服务
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudtech_postgres
    restart: unless-stopped
    profiles: ["postgres", "production"]
    environment:
      POSTGRES_USER: cloudtech
      POSTGRES_PASSWORD: ${PG_PASSWORD:-cloudtech_dev_pwd}
      POSTGRES_DB: cloudtech
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./pg_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudtech"]
      interval: 10s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cloudtech_pgadmin
    restart: unless-stopped
    profiles: ["postgres", "production"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cloudtech.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudtech-backend:latest
    container_name: cloudtech_backend
    restart: unless-stopped
    profiles: ["production"]
    environment:
      CLOUDTECH_HOST: 0.0.0.0
      CLOUDTECH_PORT: 5099
      CLOUDTECH_DB_TYPE: postgres
      CLOUDTECH_DB_HOST: postgres
      CLOUDTECH_DB_PORT: 5432
      CLOUDTECH_DB_USER: cloudtech
      CLOUDTECH_DB_PASSWORD: ${PG_PASSWORD:-cloudtech_dev_pwd}
      CLOUDTECH_DB_NAME: cloudtech
    ports:
      - "5099:5099"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: web/vite-spa
      dockerfile: Dockerfile
    image: cloudtech-frontend:latest
    container_name: cloudtech_frontend
    restart: unless-stopped
    profiles: ["production"]
    ports:
      - "5173:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: cloudtech_nginx
    restart: unless-stopped
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
