version: "3.8"

services:
  cloudtech:
    build: .
    container_name: cloudtech
    ports:
      - "5099:5099"
    env_file:
      - .env
    environment:
      - CLOUDTECH_HOST=0.0.0.0
      - CLOUDTECH_PORT=5099
      - CLOUDTECH_WORKERS=4
      - DB_TYPE=${DB_TYPE:-sqlite}
      - PG_DSN=${PG_DSN:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ADMIN_SECRET=${ADMIN_SECRET:-cloudtech-admin-2026}
      - JWT_SECRET=${JWT_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5099,http://127.0.0.1:5099}
    volumes:
      - cloudtech_data:/app/data
      - cloudtech_logs:/app/logs
      - cloudtech_backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5099/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cloudtech-net

  # PostgreSQL — enable with: DB_TYPE=postgresql docker compose up
  postgres:
    image: postgres:16-alpine
    container_name: cloudtech-pg
    profiles: ["production"]
    environment:
      POSTGRES_DB: cloudtech
      POSTGRES_USER: cloudtech
      POSTGRES_PASSWORD: ${PG_PASSWORD:-cloudtech_pg_2026}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudtech"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudtech-net

  # Nginx reverse proxy — enable with: docker compose --profile production up
  nginx:
    image: nginx:alpine
    container_name: cloudtech-nginx
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cloudtech
    restart: unless-stopped
    networks:
      - cloudtech-net

volumes:
  cloudtech_data:
  cloudtech_logs:
  cloudtech_backups:
  pg_data:

networks:
  cloudtech-net:
    driver: bridge
