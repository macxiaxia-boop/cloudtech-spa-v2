version: "3.8"

services:
  cloudtech:
    build: .
    container_name: cloudtech
    ports:
      - "5099:5099"
    environment:
      - CLOUDTECH_HOST=0.0.0.0
      - CLOUDTECH_PORT=5099
      - CLOUDTECH_WORKERS=4
      - DB_TYPE=sqlite
      # PostgreSQL (uncomment for production):
      # - DB_TYPE=postgresql
      # - PG_DSN=postgresql://user:pass@postgres:5432/cloudtech
      - JWT_SECRET=${JWT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      - WECHAT_MCH_ID=${WECHAT_MCH_ID:-}
      - WECHAT_API_KEY=${WECHAT_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - cloudtech_data:/app/data
      - cloudtech_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5099/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PostgreSQL (uncomment for production):
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: cloudtech-pg
  #   environment:
  #     POSTGRES_DB: cloudtech
  #     POSTGRES_USER: cloudtech
  #     POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   restart: unless-stopped

  # Nginx (uncomment for production with HTTPS):
  # nginx:
  #   image: nginx:alpine
  #   container_name: cloudtech-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf
  #     - ./ssl:/etc/nginx/ssl
  #   depends_on:
  #     - cloudtech
  #   restart: unless-stopped

volumes:
  cloudtech_data:
  cloudtech_logs:
  # pg_data:
