<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie 导入 — 云数科技</title>
<style>
:root { --bg:#0a0a0f; --card:#111118; --border:#1e1e2a; --accent:#6c5ce7; --accent2:#a78bfa; --green:#00c853; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:#e0e0e0; font-family:-apple-system,"Microsoft YaHei",sans-serif; padding:40px 20px; }
.container { max-width:640px; margin:0 auto; }
h1 { font-size:1.4rem; margin-bottom:24px; }
.step { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:16px; }
.step h3 { font-size:0.9rem; color:var(--accent2); margin-bottom:12px; }
.step p { color:#999; font-size:0.85rem; line-height:1.8; }
textarea { width:100%; height:200px; background:#0a0a0f; border:1px solid var(--border); border-radius:8px; color:#e0e0e0; padding:12px; font-size:0.8rem; resize:vertical; font-family:monospace; }
.btn { padding:10px 24px; background:var(--accent); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:0.9rem; }
.btn:hover { opacity:0.9; }
.btn:disabled { opacity:0.5; }
.result { margin-top:12px; padding:10px 14px; border-radius:8px; font-size:0.85rem; display:none; }
.result.ok { background:rgba(0,200,83,.1); border:1px solid var(--green); color:var(--green); display:block; }
.result.err { background:rgba(255,23,68,.1); border:1px solid #ff1744; color:#ff1744; display:block; }
.status { display:flex; gap:24px; margin-bottom:24px; }
.status-item { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px 20px; flex:1; text-align:center; }
.status-item .label { font-size:0.75rem; color:#777; margin-bottom:4px; }
.status-item .val { font-size:1.2rem; font-weight:700; }
</style>
</head>
<body>
<div class="container">
  <h1>🍪 Cookie 导入 — 解锁真实社交平台数据</h1>

  <div class="status" id="cookieStatus">
    <div class="status-item"><div class="label">小红书 Cookie</div><div class="val" id="xhs-status">检查中</div></div>
    <div class="status-item"><div class="label">抖音 Cookie</div><div class="val" id="dy-status">检查中</div></div>
  </div>

  <div class="step">
    <h3>Step 1: 安装 Chrome 扩展 "EditThisCookie"</h3>
    <p>Chrome 扩展商店搜索 <b>EditThisCookie</b> → 安装 → 右上角出现 🍪 图标</p>
  </div>

  <div class="step">
    <h3>Step 2: 登录并导出 Cookie</h3>
    <p>1. 打开 <b>xiaohongshu.com</b> 或 <b>douyin.com</b>，扫码登录<br>
       2. 点击右上角 🍪 → <b>Export</b>（导出）→ 自动复制 JSON<br>
       3. 粘贴到下方文本框 → 点击「导入」</p>
  </div>

  <div class="step">
    <h3>Step 3: 粘贴导入</h3>
    <select id="platform" style="background:#0a0a0f;border:1px solid var(--border);color:#e0e0e0;padding:8px 12px;border-radius:8px;margin-bottom:12px;">
      <option value="xiaohongshu">小红书 Xiaohongshu</option>
      <option value="douyin">抖音 Douyin</option>
    </select>
    <textarea id="cookieInput" placeholder="把 EditThisCookie 导出的 JSON 粘贴到这里..."></textarea>
    <div style="margin-top:12px;display:flex;align-items:center;gap:12px;">
      <button class="btn" id="importBtn" onclick="importCookies()">导入 Cookie</button>
      <span id="result" class="result"></span>
    </div>
  </div>
</div>

<script>
async function checkStatus() {
  try {
    const r = await fetch('/api/zhuangqi/cookies/status');
    const data = await r.json();
    document.getElementById('xhs-status').textContent = data.xiaohongshu?.count ? `✅ ${data.xiaohongshu.count}个` : '❌ 未导入';
    document.getElementById('dy-status').textContent = data.douyin?.count ? `✅ ${data.douyin.count}个` : '❌ 未导入';
  } catch(e) {}
}
checkStatus();

async function importCookies() {
  const btn = document.getElementById('importBtn');
  const result = document.getElementById('result');
  btn.disabled = true; btn.textContent = '导入中...';
  result.className = 'result';

  try {
    const raw = document.getElementById('cookieInput').value.trim();
    const cookies = JSON.parse(raw);
    const platform = document.getElementById('platform').value;

    const r = await fetch('/api/zhuangqi/cookies', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({platform, cookies})
    });
    const data = await r.json();
    if (data.ok) {
      result.className = 'result ok';
      result.textContent = `成功导入 ${data.count} 个 Cookie！`;
      checkStatus();
    } else {
      throw new Error(data.error);
    }
  } catch(e) {
    result.className = 'result err';
    result.textContent = '导入失败: ' + e.message;
  }
  btn.disabled = false; btn.textContent = '导入 Cookie';
}
</script>
</body>
</html>
