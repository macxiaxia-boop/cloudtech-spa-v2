<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — 云数科技</title>
<link rel="stylesheet" href="design-system.css">
<style>
:root { --bg:#0a0a0f; --card:#111118; --border:#1e1e2a; --accent:#6c5ce7; --accent2:#a78bfa; --green:#00c853; --red:#ff1744; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:#e0e0e0; font-family:-apple-system,"Microsoft YaHei",sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.auth-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:48px 40px; width:100%; max-width:420px; }
.auth-card h1 { font-size:1.5rem; margin-bottom:4px; }
.auth-card p { color:#777; font-size:0.85rem; margin-bottom:32px; }
.form-group { margin-bottom:20px; }
.form-group label { display:block; font-size:0.85rem; color:#999; margin-bottom:6px; }
.form-group input { width:100%; padding:12px 16px; background:#0a0a0f; border:1px solid var(--border); border-radius:8px; color:#e0e0e0; font-size:0.95rem; outline:none; transition:border-color .2s; }
.form-group input:focus { border-color:var(--accent); }
.btn { width:100%; padding:14px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-size:0.95rem; cursor:pointer; transition:opacity .2s; }
.btn:hover { opacity:0.9; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.error-msg { background:rgba(255,23,68,.1); border:1px solid var(--red); color:var(--red); padding:10px 14px; border-radius:8px; font-size:0.85rem; margin-bottom:16px; display:none; }
.auth-links { margin-top:24px; text-align:center; font-size:0.85rem; color:#777; }
.auth-links a { color:var(--accent2); text-decoration:none; }
.auth-links a:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="auth-card">
  <h1>登录云数科技</h1>
  <p>AI数字营销中台 · 23工具·6引擎</p>
  <div class="error-msg" id="error"></div>
  <form id="loginForm">
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="email" placeholder="your@email.com" required autofocus>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="••••••••" required minlength="6">
    </div>
    <button type="submit" class="btn" id="submitBtn">登录</button>
  </form>
  <div class="auth-links">
    还没有账号？<a href="/register.html">立即注册</a>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const error = document.getElementById('error');
  btn.disabled = true; btn.textContent = '登录中...'; error.style.display = 'none';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (data.token) {
      localStorage.setItem('cloudtech_token', data.token);
      localStorage.setItem('cloudtech_user', JSON.stringify(data.user));
      window.location.href = '/admin';
    } else {
      throw new Error(data.error || '登录失败');
    }
  } catch (err) {
    error.textContent = err.message;
    error.style.display = 'block';
    btn.disabled = false; btn.textContent = '登录';
  }
});
</script>
</body>
</html>
