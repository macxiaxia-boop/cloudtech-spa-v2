name: Verify (pytest + lint)

on:
  push:
    branches:
      - master
      - main
      - fix/cloudtech-v4-p0-security-20261014
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  verify:
    name: pytest and real evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout original CloudTech repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install declared dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          python -m pip install pytest pytest-asyncio fastapi pydantic pillow httpx

      - name: Original standard verify suite
        shell: bash
        run: |
          python -m pytest \
            tests/test_models.py \
            tests/test_bill_acceptance.py \
            tests/test_bill_provider_interface.py \
            tests/test_pipeline.py \
            tests/test_video_mixer.py \
            tests/test_cloudtech_acceptance.py \
            tests/test_crm.py \
            tests/test_modules.py \
            tests/test_v63_t03_multitenant_stress.py \
            workflows/tests/ \
            tests/test_ui_pages_binding.py \
            tests/test_v22_stub_fail_closed.py \
            tests/test_v22_public_image_mount.py \
            tests/test_v22_forward_errors.py \
            --tb=short -q --junitxml=verify_junit.xml

      - name: Upload actual JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-junit
          path: verify_junit.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Verify report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          report = Path('verify_junit.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## CloudTech full verification (not V4-only)\n\n')
              if not report.exists():
                  out.write('JUnit: absent; verify gate NOT PASSED.\n')
              else:
                  root = ET.parse(report).getroot()
                  suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
                  total = sum(int(s.get('tests', 0)) for s in suites)
                  failed = sum(int(s.get('failures', 0)) for s in suites)
                  errors = sum(int(s.get('errors', 0)) for s in suites)
                  skip = sum(int(s.get('skipped', 0)) for s in suites)
                  passed = total - failed - errors - skip
                  out.write(f'Actual PASS={passed} FAIL={failed} ERR={errors} SKIP={skip}; '
                            f'production approval: NOT INFERRED.\n')
          PY

  frontend-security:
    name: Frontend API security tests and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout original CloudTech repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/vite-spa/package-lock.json

      - name: Install declared SPA dependencies
        working-directory: web/vite-spa
        run: npm ci

      - name: Test same-origin bearer safety and real request timeout abort
        working-directory: web/vite-spa
        run: npm test -- src/lib/api.test.ts --environment node

      - name: Setup Python for deterministic responsive image generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image build dependency
        run: python -m pip install "Pillow>=10,<13"

      - name: Build complete route-split SPA
        working-directory: web/vite-spa
        run: npm run build
