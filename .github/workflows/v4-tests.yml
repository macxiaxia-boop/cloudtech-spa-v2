name: V4 Tests

on:
  push:
    paths:
      - 'workflows/v4/**'
      - 'adapters/**'
      - 'api/v4/**'
      - 'tests/test_v4_*.py'
      - 'tests/test_adapters_*.py'
  pull_request:
    paths:
      - 'workflows/v4/**'
      - 'adapters/**'
      - 'api/v4/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi pydantic pillow httpx
      - name: Run V4 unit + integration tests
        run: |
          python -m pytest tests/test_v4_*.py tests/test_adapters_*.py -v --tb=short --junitxml=v4-junit.xml
      - name: Run migration audit (dry-run)
        run: python scripts/run_v4_migration.py
      - name: Upload actual V4 JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-junit
          path: v4-junit.xml
          if-no-files-found: warn

      - name: V4 Evidence Summary (actual, not hardcoded)
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path("v4-junit.xml")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## CloudTech V4 CI evidence\n\n")
              f.write("- Scope: existing V4 unit/mock/integration tests (not production validation)\n")
              if not p.exists():
                  f.write("- No JUnit file produced; TEST_STATUS=UNKNOWN\n")
              else:
                  root = ET.parse(p).getroot()
                  suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
                  total = sum(int(s.get("tests", 0)) for s in suites)
                  failures = sum(int(s.get("failures", 0)) for s in suites)
                  errors = sum(int(s.get("errors", 0)) for s in suites)
                  skipped = sum(int(s.get("skipped", 0)) for s in suites)
                  passed = total - failures - errors - skipped
                  f.write(f"- PASS={passed} FAIL={failures} ERR={errors} SKIP={skipped} TOTAL={total}\n")
                  f.write("- Integrated/Validated/Production Ready: NOT ASSERTED by this workflow\n")
          PY
