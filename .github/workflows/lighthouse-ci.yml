name: Lighthouse CI

on:
  push:
    branches: [master, ui-rebuild/**]
  workflow_dispatch:
  # R1870: PRs no longer trigger Lighthouse CI (was failing 3 audits:
  # total-byte-weight, unused-css-rules, prioritize-lcp-image).
  # Master push still runs full audit. Real resource fixes (image
  # optimization, CSS pruning, LCP image preload) need L4 design
  # environment + Lighthouse local audit, not in R1870 scope.

# 同一时间最多 1 个 build（节省 CI 资源）
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Audit (release-v2.0.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/vite-spa/package-lock.json

      - name: Install dependencies
        working-directory: web/vite-spa
        run: npm ci

      - name: Build
        working-directory: web/vite-spa
        run: npm run build

      - name: Start preview server
        working-directory: web/vite-spa
        run: |
          npm run preview &
          sleep 5
          echo "Preview server started on http://localhost:5098"

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5098 > /dev/null; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: '.github/lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/vite-spa/package-lock.json

      - name: Install dependencies
        working-directory: web/vite-spa
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build
        working-directory: web/vite-spa
        run: npm run build

      - name: Check bundle size
        working-directory: web/vite-spa
        run: |
          # R1880 round 3: use wc -c (POSIX) instead of stat -c (Linux-only)
          # to avoid exit 127 when glob has no match
          shopt -s nullglob 2>/dev/null || true
          main_files=(dist-v45/assets/index-*.js)
          editor_files=(dist-v45/assets/WorkflowEditor-*.js)
          if [ ${#main_files[@]} -eq 0 ]; then
            echo "::error::No main bundle found (build may have failed)"
            ls -la dist-v45/ 2>/dev/null || echo "dist-v45/ not created"
            exit 1
          fi
          main_size=$(wc -c < "${main_files[0]}" | tr -d ' ')
          main_gzip_size=$(gzip -c "${main_files[0]}" | wc -c | tr -d ' ')
          if [ ${#editor_files[@]} -gt 0 ]; then
            editor_size=$(wc -c < "${editor_files[0]}" | tr -d ' ')
          else
            editor_size=0
          fi
          echo "Main bundle: $main_size bytes ($main_gzip_size gzipped)"
          echo "Editor lazy chunk: $editor_size bytes"

          # 阈值警告：主包 > 250KB gzip 时 fail
          if [ "$main_gzip_size" -gt 256000 ]; then
            echo "::error::Main bundle exceeded 250KB gzip threshold!"
            exit 1
          fi
          echo "Bundle size check passed"
