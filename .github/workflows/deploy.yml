name: Deploy SPA

on:
  push:
    branches: [master]
    tags: ['release-*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/vite-spa/package-lock.json
      - working-directory: web/vite-spa
        run: npm ci
      - working-directory: web/vite-spa
        run: npm run build
      - working-directory: web/vite-spa
        run: ls -lah dist-v45/

  docker:
    name: Build + Push Docker image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cloudtech-spa
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: web/vite-spa
          file: web/vite-spa/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/vite-spa/package-lock.json
      - working-directory: web/vite-spa
        run: npm ci
      - working-directory: web/vite-spa
        run: npm run build
      - working-directory: web/vite-spa
        run: |
          npm run preview &
          for i in {1..30}; do
            curl -s http://localhost:5098 > /dev/null && break
            sleep 1
          done
      - uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: '.github/lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
