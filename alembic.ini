# Alembic 配置 — CloudTech SaaS Phase 45 D13-16
[alembic]
script_location = migrations
prepend_sys_path = D:\CloudTech-Portable
version_path_separator = os
sqlalchemy.url = sqlite:///D:/CloudTech-Portable/data/cloudtech.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
